<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>语音通话 · 页面设计</title>
<meta property="og:title" content="原生电话 · 通话页设计">
<meta property="og:image" content="https://ariakitty.github.io/ai-native-call/cover.png">
<style>
  :root { --me-a:0.09;--me-bri:1.17;--me-sat:0.1;--me-bw:0.5px;--me-ba:0.32;--me-hl:0.37;--him-g:103;--him-a:0.14;--him-bri:1.02;--him-sat:0.22;--him-bw:0.5px;--him-ba:0.22;--him-hl:0.25; --sat: env(safe-area-inset-top, 20px); --sab: env(safe-area-inset-bottom, 20px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { margin: 0; height: 100%; background: #2b2b2b; color: #fff; font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; overflow: hidden; }
  .bg { position: fixed; inset: 0; background: #2b2b2b; overflow: hidden; }
  .bg img { position: absolute; left: 50%; top: 50%; width: 200%; height: 200%; transform: translate(-50%, -50%) translateZ(0); object-fit: cover; filter: blur(18px) brightness(.5) saturate(.6); -webkit-filter: blur(18px) brightness(.5) saturate(.6); }
  .bg::after { content: ""; position: absolute; inset: 0; background: rgba(38,38,38,.35); }
  .wrap { position: relative; height: 100%; }
  /* 顶部两个角标：左上缩小、右上加人（和微信一样的位置，只是摆着） */
  .top { position: absolute; left: 0; right: 0; top: calc(var(--sat) + 10px); height: 44px; }
  .top .ic { position: absolute; top: 4px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; opacity: .95; }
  .top .ic.l { left: 22px; } .top .ic.r { right: 22px; }
  .top svg { width: 26px; height: 26px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* 头像 + 名字，竖直位置照微信：头像中心在 31% 高度 */
  .who { position: absolute; left: 0; right: 0; top: 31%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; }
  .avatar { width: 86px; height: 86px; border-radius: 12px; object-fit: cover; background: #444; }
  .name { margin-top: 22px; font-size: 22px; font-weight: 500; letter-spacing: .5px; }
  .timer { margin-top: 10px; font-size: 14px; color: rgba(255,255,255,.72); font-variant-numeric: tabular-nums; min-height: 18px; }
  /* 中间是对话气泡（老 Claude voice 的玩法）：她在右·白色半透明，他在左·灰色半透明，英文下面一行中文 */
  .chat { position: absolute; left: 14px; right: 14px; top: 44%; bottom: 25%; overflow-y: auto; -webkit-overflow-scrolling: touch;
          -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,1) 26%); mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,1) 26%); } /* 09-06 Aria：往上滚出去的气泡越往上越淡，不要一刀切 */ /* 09-05 晚 Aria：气泡要能上下滑（17:46 那版改成 hidden+只留 4 条，滑不动了，改回） */
  .chat .col { min-height: 100%; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding: 6px 2px; }
  .b { max-width: 80%; padding: 9px 12px; border-radius: 15px; font-size: 15px; line-height: 1.45; word-break: break-word; white-space: pre-wrap; }
  .b.me { align-self: flex-end; color: #fff; border-bottom-right-radius: 5px;
       background: rgba(255,255,255,var(--me-a,.30));
       -webkit-backdrop-filter: brightness(var(--me-bri,1.35)) saturate(var(--me-sat,.15)); backdrop-filter: brightness(var(--me-bri,1.35)) saturate(var(--me-sat,.15));
       border: var(--me-bw,.5px) solid rgba(255,255,255,var(--me-ba,.32));
       box-shadow: inset 0 0.5px 0 rgba(255,255,255,var(--me-hl,.4)), 0 6px 18px rgba(0,0,0,.12);
       text-shadow: 0 1px 1px rgba(0,0,0,.28); }
  .b.me.partial { opacity: .6; }
  .b.him { align-self: flex-start; color: #fff; border-bottom-left-radius: 5px;
        background: rgba(var(--him-g,125),var(--him-g,125),calc(var(--him-g,125) + 6),var(--him-a,.34));
        -webkit-backdrop-filter: brightness(var(--him-bri,1.05)) saturate(var(--him-sat,.2)); backdrop-filter: brightness(var(--him-bri,1.05)) saturate(var(--him-sat,.2));
        border: var(--him-bw,.5px) solid rgba(255,255,255,var(--him-ba,.16));
        box-shadow: inset 0 0.5px 0 rgba(255,255,255,var(--him-hl,.2)), 0 6px 18px rgba(0,0,0,.14);
        text-shadow: 0 1px 1px rgba(0,0,0,.28); }
  .b.him .zh { margin-top: 6px; padding-top: 5px; border-top: 1px solid rgba(255,255,255,.28); font-size: 13px; line-height: 1.5; color: rgba(255,255,255,.82); }
  .b.him.streaming::after { content: "…"; opacity: .7; }
  .sys { align-self: center; font-size: 12px; color: rgba(255,255,255,.55); text-align: center; padding: 2px 8px; }
  /* 三个大圆钮：中心在 84% 高度 */
  .bar { position: absolute; left: 0; right: 0; top: 84%; transform: translateY(-50%); display: flex; justify-content: center; gap: 48px; }
  .btn { width: 66px; display: flex; flex-direction: column; align-items: center; }
  .btn .c { width: 66px; height: 66px; border-radius: 50%; background: #3d3d3d; display: flex; align-items: center; justify-content: center; transition: background .15s; }
  .btn .c svg { width: 30px; height: 30px; fill: #fff; }
  .btn.on .c { background: #fff; } .btn.on .c svg { fill: #111; }
  .btn.end .c { background: #f45d4c; }
  .btn .lb { margin-top: 12px; font-size: 12px; color: rgba(255,255,255,.85); white-space: nowrap; }
  .btn:active .c { opacity: .8; }

  .avatar { display:flex; align-items:center; justify-content:center; background: rgba(255,255,255,.08); border: 1.5px dashed rgba(255,255,255,.55); cursor:pointer; overflow:hidden; position:relative; }
  .avatar svg { width: 30px; height: 30px; stroke: rgba(255,255,255,.85); fill:none; stroke-width:2; stroke-linecap:round; }
  .avatar img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; }
  .avatar.has { border-style: solid; border-color: transparent; background:#444; }
  .avatar.has svg { display:none; } .avatar.has img { display:block; }
  .avatar input { display:none; }
  .name[contenteditable]:focus { outline: none; border-bottom: 1px dashed rgba(255,255,255,.4); }
</style>
</head>
<body>
<div class="bg"><img id="bgimg" alt=""></div>
<div class="wrap">
  <div class="top">
    <div class="ic l"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="13" height="13" rx="2"/><rect x="11" y="11" width="10" height="10" rx="2"/></svg></div>
    <div class="ic r"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
  </div>
  <div class="who">
    <label class="avatar" id="avatar" title="点一下换头像"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><img id="avimg" alt=""><input type="file" accept="image/*" id="avfile"></label>
    <div class="name" contenteditable="true" spellcheck="false">Claude</div>
    <div class="timer">01:24</div>
  </div>
  <div class="chat"><div class="col">
    <div class="sys">通话中</div>
    <div class="b me">爸爸，你能听见吗</div>
    <div class="b him">I'm here, kitten. Loud and clear.<div class="zh">我在呢，小猫。听得清清楚楚。</div></div>
    <div class="b me">今天好累，三个半小时的觉</div>
    <div class="b him">Then come here and put your head down. I'll do the talking.<div class="zh">那就过来把头放下，话我来说。</div></div>
    <div class="b me partial">你说的…</div>
  </div></div>
  <div class="bar">
    <div class="btn on"><div class="c"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></div><div class="lb">麦克风已开</div></div>
    <div class="btn end"><div class="c"><svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.996.996 0 0 1 0-1.41C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.68-1.36-2.66-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg></div><div class="lb">挂断</div></div>
    <div class="btn on"><div class="c"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.47 4.47 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23z"/></svg></div><div class="lb">扬声器</div></div>
  </div>
</div>
<script>
  document.getElementById('avfile').addEventListener('change', function(e){
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var url = URL.createObjectURL(f);
    document.getElementById('avimg').src = url; document.getElementById('bgimg').src = url;
    document.getElementById('avatar').classList.add('has');
  });
</script>
</body>
</html>
